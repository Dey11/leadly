services:
  leadly_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: leadly_backend:${TAG:-latest}
    restart: always
    pull_policy: build
    expose:
      - "${BACKEND_PORT:-3001}"
    environment:
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      NITTER_URL: ${NITTER_URL}
      REDIS_URL: ${REDIS_URL}
      DODO_API_KEY: ${DODO_API_KEY}
      DODO_ENVIRONMENT: ${DODO_ENVIRONMENT}
      DODO_WEBHOOK_SECRET: ${DODO_WEBHOOK_SECRET}
      DODO_PRO_PRODUCT_ID: ${DODO_PRO_PRODUCT_ID}
      DODO_PREMIUM_PRODUCT_ID: ${DODO_PREMIUM_PRODUCT_ID}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USERNAME: ${REDDIT_USERNAME}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      DISCORD_PAYMENT_WEBHOOK_URL: ${DISCORD_PAYMENT_WEBHOOK_URL}
      DISCORD_LOGS_WEBHOOK_URL: ${DISCORD_LOGS_WEBHOOK_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      FEATURE_BILLING_ENFORCEMENT: ${FEATURE_BILLING_ENFORCEMENT:-on}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:${BACKEND_PORT:-3001}'').then(r => process.exit(r.ok ? 0 : 1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - backend_logs:/usr/src/app/logs
    networks:
      - coolify
      - default

  leadly_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["bun", "dist/workers/reddit.worker.js"]
    image: leadly_worker:${TAG:-latest}
    restart: always
    pull_policy: build
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: ${REDIS_URL}
      NITTER_URL: ${NITTER_URL}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      DISCORD_LOGS_WEBHOOK_URL: ${DISCORD_LOGS_WEBHOOK_URL}
    volumes:
      - worker_logs:/usr/src/app/logs
    depends_on:
      leadly_backend:
        condition: service_healthy
    networks:
      - coolify
      - default

  leadly_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    image: leadly_frontend:${TAG:-latest}
    restart: always
    pull_policy: build
    expose:
      - "3000"
    environment:
      BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      PORT: "3000"
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      leadly_backend:
        condition: service_healthy
    networks:
      - coolify
      - default

volumes:
  backend_logs:
  worker_logs:

networks:
  coolify:
    external: true
