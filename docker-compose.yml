services:
  leadly_redis:
    container_name: leadly_redis
    image: redis:7-alpine
    network_mode: host
    restart: always
    pull_policy: if_not_present
    command: redis-server --port 6381 --save 60 1 --loglevel warning
    volumes:
      - leadly_redis_data:/data

  leadly_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    image: leadly_backend:${TAG}
    container_name: leadly_backend
    restart: always
    pull_policy: build
    environment:
      - DATABASE_URL
      - PORT
      - NODE_ENV
      - SESSION_SECRET
      - FRONTEND_URL
      - NITTER_URL=
      - REDIS_URL
      - DODO_API_KEY
      - DODO_ENVIRONMENT
      - DODO_WEBHOOK_SECRET
      - DODO_PRO_PRODUCT_ID
      - DODO_PREMIUM_PRODUCT_ID
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - REDDIT_USERNAME
      - GOOGLE_GENERATIVE_AI_API_KEY
    depends_on:
      - leadly_redis

  leadly_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["bun", "src/workers/reddit.worker.ts"]
    container_name: leadly_worker
    image: leadly_worker:${TAG}
    network_mode: host
    restart: always
    pull_policy: build
    environment:
      - DATABASE_URL
      - PORT
      - NODE_ENV
      - SESSION_SECRET
      - FRONTEND_URL
      - NITTER_URL=
      - REDIS_URL
      - DODO_API_KEY
      - DODO_ENVIRONMENT
      - DODO_WEBHOOK_SECRET
      - DODO_PRO_PRODUCT_ID
      - DODO_PREMIUM_PRODUCT_ID
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - REDDIT_USERNAME
      - GOOGLE_GENERATIVE_AI_API_KEY
    depends_on:
      - leadly_backend
      - leadly_redis

  leadly_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    network_mode: host
    image: leadly_frontend:${TAG}
    container_name: leadly_frontend
    restart: always
    pull_policy: build
    environment:
      - BACKEND_URL
      - NEXT_PUBLIC_BACKEND_URL
    depends_on:
      - leadly_backend

volumes:
  leadly_redis_data:

networks:
  default: 
    external: true
    name: host
